<!DOCTYPE html>
<html>
<head><meta charset="utf-8"/><title>Desmos data-URI iframe test (Flutter web pattern)</title>
<style>html,body{margin:0;height:100%;}iframe{border:1px solid #ccc;width:100%;height:420px;}</style>
</head>
<body>
<h3>Flutter WebView pattern: data: URI iframe</h3>
<iframe id="frame"></iframe>
<script>
const html = `<!DOCTYPE html>
<html><head>
<meta charset="utf-8"/>
<script src="https://www.desmos.com/api/v1.9/calculator.js?apiKey=dcb31709b452b1f69fc8a5890484ff01"><\/script>
<style>html,body{margin:0;height:100%;}#calculator{width:100%;height:100%;}</style>
</head><body><div id="calculator"></div>
<script>(function(){
var data={expression:'y=sin(3x)',xRange:[-2,2],yRange:[-1.5,1.5]};
function init(){
 if(typeof Desmos==='undefined'){ setTimeout(init,50); return; }
 var elt=document.getElementById('calculator');
 var calc=Desmos.GraphingCalculator(elt,{expressions:false,settingsMenu:false,zoomButtons:true});
 calc.setExpression({id:'main',latex:data.expression});
 calc.setMathBounds({left:data.xRange[0],right:data.xRange[1],bottom:data.yRange[0],top:data.yRange[1]});
 window.__desmosReady=true;
}
init();
})();<\/script></body></html>`;
document.getElementById('frame').src = 'data:text/html;charset=utf-8,' + encodeURIComponent(html);
</script>
</body>
</html>
