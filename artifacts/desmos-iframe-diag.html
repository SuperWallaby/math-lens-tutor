<!DOCTYPE html>
<html>
<head><meta charset="utf-8"/><title>Desmos iframe diagnostics</title>
<style>body{font:14px sans-serif;margin:12px}iframe{width:100%;height:420px;border:1px solid #ccc}pre{background:#f4f4f4;padding:8px}</style>
</head>
<body>
<h3>Desmos in data:URI iframe (Flutter web)</h3>
<pre id="log">loading…</pre>
<iframe id="frame"></iframe>
<script>
const log = (m) => { document.getElementById('log').textContent += '\n' + m; };
window.addEventListener('message', (e) => {
  if (e.data && e.data.source === 'desmos-test') log(JSON.stringify(e.data));
});
const inner = `<!DOCTYPE html><html><head><meta charset='utf-8'/>
<script src='https://www.desmos.com/api/v1.9/calculator.js?apiKey=dcb31709b452b1f69fc8a5890484ff01'><\/script>
<style>html,body{margin:0;height:100%}#calculator{width:100%;height:100%}</style>
</head><body><div id='calculator'></div><script>
function post(p){parent.postMessage(Object.assign({source:'desmos-test'},p),'*');}
var data={expression:'y=sin(3x)',xRange:[-2,2],yRange:[-1.5,1.5]};
function init(attempt){
 post({step:'init',attempt:attempt,desmos:typeof Desmos});
 if(typeof Desmos==='undefined'){ if(attempt<80) setTimeout(function(){init(attempt+1);},100); else post({error:'Desmos never loaded'}); return; }
 var elt=document.getElementById('calculator');
 var calc=Desmos.GraphingCalculator(elt,{expressions:false,settingsMenu:false,zoomButtons:true});
 calc.setExpression({id:'main',latex:data.expression});
 calc.setMathBounds({left:data.xRange[0],right:data.xRange[1],bottom:data.yRange[0],top:data.yRange[1]});
 post({step:'done',expr:data.expression,state:calc.getState().expressions.list.length});
}
init(0);
<\/script></body></html>`;
document.getElementById('frame').src = 'data:text/html;charset=utf-8,' + encodeURIComponent(inner);
</script>
</body>
</html>
