<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>인스타 감성 아이콘 2차</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; background: #0c0c0e; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      padding: 28px 16px 48px;
    }
    h1 { text-align: center; font-size: 20px; margin-bottom: 6px; }
    .sub { text-align: center; font-size: 13px; opacity: .6; margin-bottom: 24px; }
    .row {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px; max-width: 960px; margin: 0 auto;
    }
    .item { text-align: center; }
    .item img {
      width: 160px; height: 160px; border-radius: 36px; object-fit: cover;
      box-shadow: 0 16px 40px rgba(0,0,0,.45);
    }
    .item .name { margin-top: 12px; font-size: 15px; font-weight: 700; }
    .item .desc { margin-top: 4px; font-size: 12px; opacity: .55; }
  </style>
</head>
<body>
  <h1>인스타 감성 · 다른 안들</h1>
  <p class="sub">앱에는 아직 안 넣음 · 번호로 골라주세요</p>
  <div class="row">
    <div class="item">
      <img src="icon-e-shutter.png" alt="E" />
      <div class="name">E · 셔터/스캔</div>
      <div class="desc">사진 찍어서 공부</div>
    </div>
    <div class="item">
      <img src="icon-f-slash.png" alt="F" />
      <div class="name">F · 슬래시</div>
      <div class="desc">미니멀 로고</div>
    </div>
    <div class="item">
      <img src="icon-g-blob.png" alt="G" />
      <div class="name">G · 하트블롭</div>
      <div class="desc">귀엽고 트렌디</div>
    </div>
    <div class="item">
      <img src="icon-h-trophy.png" alt="H" />
      <div class="name">H · 트로피</div>
      <div class="desc">경쟁/우열 느낌</div>
    </div>
  </div>
</body>
</html>
