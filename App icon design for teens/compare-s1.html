<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>S1 캐릭터 vs 실사 비교</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; background: #0c0c0e; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      padding: 32px 16px 48px;
    }
    h1 { text-align: center; font-size: 20px; margin-bottom: 8px; }
    .sub { text-align: center; font-size: 13px; opacity: .6; margin-bottom: 28px; }
    .row {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 28px; max-width: 720px; margin: 0 auto;
    }
    @media (max-width: 640px) { .row { grid-template-columns: 1fr; } }
    .item { text-align: center; }
    .item img {
      width: min(280px, 100%); aspect-ratio: 1;
      border-radius: 56px; object-fit: cover;
      box-shadow: 0 20px 50px rgba(0,0,0,.5);
      background: #222;
    }
    .tag {
      display: inline-block; margin-bottom: 12px;
      font-size: 12px; font-weight: 700; letter-spacing: .04em;
      padding: 5px 12px; border-radius: 999px; background: rgba(255,255,255,.1);
    }
    .name { margin-top: 14px; font-size: 16px; font-weight: 700; }
    .desc { margin-top: 6px; font-size: 12px; opacity: .55; line-height: 1.45; }
    .note {
      max-width: 560px; margin: 32px auto 0; text-align: center;
      font-size: 13px; opacity: .7; line-height: 1.5;
    }
  </style>
</head>
<body>
  <h1>나란히 비교</h1>
  <p class="sub">앱에는 아직 안 넣음 · 같은 스토리, 스타일만 다름</p>
  <div class="row">
    <div class="item">
      <div class="tag">A</div>
      <img src="icon-story-mom.png" alt="3D 캐릭터" />
      <div class="name">3D 캐릭터 (S1)</div>
      <div class="desc">과장 표정 · 작은 아이콘에서도<br/>스토리가 잘 읽힘</div>
    </div>
    <div class="item">
      <div class="tag">B</div>
      <img src="icon-story-mom-real.png" alt="실사" />
      <div class="name">실사 시안</div>
      <div class="desc">실제 사진 느낌 · 고급스럽지만<br/>작아지면 얼굴이 뭉개질 수 있음</div>
    </div>
  </div>
  <p class="note">괜찮으면 A/B 중 골라주세요. 아직 앱에는 반영하지 않습니다.</p>
</body>
</html>
