<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>우열</title>
  <link rel="stylesheet" href="pin.css?v=4" />
</head>
<body>
  <div class="atm">
    <div class="pad">
      <div class="tiny">분석 완료</div>
      <div class="hero mt10" style="text-align:center">기울기 부호를<br />자주 헷갈려요</div>
      <div class="info pill raised mt18">
        <div class="ico blue">↗</div>
        <div><b>약한 유형</b><small>일차함수</small></div>
      </div>
      <div class="info pill raised mt10">
        <div class="ico blue">◎</div>
        <div><b>추천 훈련</b><small>같은 유형 5문제</small></div>
      </div>
      <div class="grow"></div>
      <button type="button" class="btn pill blue" onclick="go('practice')">비슷한 문제 풀기</button>
      <button type="button" class="btn pill raised mt10" onclick="go('home')">홈으로</button>
    </div>
  </div>
  <script src="pin.js"></script>
</body>
</html>
