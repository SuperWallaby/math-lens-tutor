<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>우열</title>
  <link rel="stylesheet" href="pin.css?v=4" />
</head>
<body>
  <div class="atm">
    <div class="pad">
      <div class="tiny">PRACTICE QUIZ</div>
      <div class="btn pill blue mt10" style="height:34px;font-size:12px;width:110px;margin:10px auto 0">훈련 1 / 1</div>
      <div class="round raised mt16" style="padding:16px">
        <div class="q">일차함수 y = 2x + 1 의 기울기는?</div>
      </div>
      <button type="button" class="choice pill raised mt12" data-choice>1</button>
      <button type="button" class="choice pill raised mt8" data-choice>0</button>
      <button type="button" class="choice pill blue mt8" data-choice>2</button>
      <button type="button" class="choice pill raised mt8" data-choice>-1</button>
      <button type="button" class="btn pill blue mt16" onclick="go('analysis')">다음 문제</button>
    </div>
  </div>
  <script src="pin.js"></script>
  <script>
    document.querySelectorAll("[data-choice]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        document.querySelectorAll("[data-choice]").forEach(function (el) {
          el.classList.remove("blue");
          el.classList.add("raised");
        });
        btn.classList.remove("raised");
        btn.classList.add("blue");
      });
    });
  </script>
</body>
</html>
