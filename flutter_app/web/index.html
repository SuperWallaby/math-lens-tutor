<!DOCTYPE html>
<html>
<head>
  <!--

    it to work correctly.

    For more details:

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="AI math solution analysis and adaptive practice">
  <meta name="theme-color" content="#007BFF">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="우열">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>우열</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #F3F3F1;
    }
    flt-glass-pane,
    flt-semantics-host {
      background: transparent !important;
    }
  </style>
  <link rel="preconnect" href="https://www.desmos.com" crossorigin>
  <link rel="dns-prefetch" href="https://www.desmos.com">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // printing 패키지 PDF.js (웹에서 PDF 미리보기/출력용)
    var dartPdfJsBaseUrl = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
    (function () {
      var q = new URLSearchParams(location.search).get("store_screenshot") || "";
      var map = {
        login: "pin/login.html?v=4",
        signup: "pin/login.html?v=4",
        "hub-first": "pin/home.html?v=4",
        "hub-returning": "pin/home.html?v=4",
        home: "pin/home.html?v=4",
        "practice-question": "pin/practice.html?v=4",
        practice: "pin/practice.html?v=4",
        "analysis-weak": "pin/analysis.html?v=4",
        "analysis-ok": "pin/analysis.html?v=4",
        analysis: "pin/analysis.html?v=4"
      };
      var src = map[q];
      if (!src) return;
      var frame = document.createElement("iframe");
      frame.id = "wooyeol-pin";
      frame.src = src;
      frame.setAttribute(
        "style",
        "position:fixed;inset:0;width:100%;height:100%;border:0;z-index:2147483647;background:#F3F3F1"
      );
      document.body.appendChild(frame);
      window.addEventListener("message", function (event) {
        try {
          var data = typeof event.data === "string" ? JSON.parse(event.data) : event.data;
          if (!data || data.source !== "wooyeol-pin") return;
          var next = {
            home: "hub-returning",
            practice: "practice-question",
            analysis: "analysis-weak",
            login: "login"
          }[data.action];
          if (!next) return;
          var url = new URL(location.href);
          url.searchParams.set("store_screenshot", next);
          location.replace(url.toString());
        } catch (err) {}
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
